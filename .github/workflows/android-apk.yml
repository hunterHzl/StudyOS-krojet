name: Build StudyOS Android APK

on:
  push:
    branches: [main]
    paths:
      - 'source.zip'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract StudyOS source archive
        run: |
          test -f source.zip
          mkdir extracted
          unzip -q source.zip -d extracted
          test -f extracted/package.json
          test -f extracted/capacitor.config.ts
          test -f extracted/studyos436/studyos43/studyos-app/www/index.html

      - name: Install dependencies
        working-directory: extracted
        run: npm install --no-audit --no-fund

      - name: Generate Android project
        working-directory: extracted
        run: npx cap add android

      - name: Sync web assets
        working-directory: extracted
        run: npx cap sync android

      - name: Build installable debug APK
        working-directory: extracted/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: StudyOS-4.3.6-Android-debug-APK
          path: extracted/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
